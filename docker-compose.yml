services:

  # ─── Reverse Proxy ────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.3.4
    container_name: neighborly_traefik
    profiles: [infra]
    user: root
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=neighborly_network"
      - "--entrypoints.web.address=:${BASE_COMPOSE_TRAEFIK_HTTP_CONTAINER_PORT}"
      - "--log.level=INFO"
    ports:
      - "${BASE_COMPOSE_TRAEFIK_HTTP_HOST_PORT}:${BASE_COMPOSE_TRAEFIK_HTTP_CONTAINER_PORT}"
      - "${BASE_COMPOSE_TRAEFIK_DASHBOARD_HOST_PORT}:${BASE_COMPOSE_TRAEFIK_DASHBOARD_CONTAINER_PORT}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - neighborly_network
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${BASE_COMPOSE_LOKI_CONTAINER_PORT}/loki/api/v1/push"
        loki-external-labels: "service={{.Name}}"

  # ─── Database ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.8-alpine
    container_name: neighborly_db
    profiles: [infra, app]
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${DB_NAME:-neighborly_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - neighborly_network
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-${BASE_COMPOSE_POSTGRES_HOST_PORT_DEFAULT}}:${BASE_COMPOSE_POSTGRES_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-neighborly_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${BASE_COMPOSE_LOKI_CONTAINER_PORT}/loki/api/v1/push"
        loki-external-labels: "service={{.Name}}"

  # ─── Dedicated media metadata DB ──────────────────────────────────────────
  postgres-media:
    image: postgres:16.8-alpine
    container_name: neighborly_media_db
    profiles: [infra, app]
    environment:
      POSTGRES_USER: ${MEDIA_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MEDIA_DB_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${MEDIA_DB_NAME:-media_db}
    volumes:
      - postgres_media_data:/var/lib/postgresql/data
      - ./docker/postgres-media-init:/docker-entrypoint-initdb.d:ro
    networks:
      - neighborly_network
    restart: unless-stopped
    ports:
      - "${BASE_COMPOSE_POSTGRES_MEDIA_HOST_PORT}:${BASE_COMPOSE_POSTGRES_MEDIA_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEDIA_DB_USER:-postgres} -d ${MEDIA_DB_NAME:-media_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${BASE_COMPOSE_LOKI_CONTAINER_PORT}/loki/api/v1/push"
        loki-external-labels: "service={{.Name}}"

  # ─── Object storage (S3-compatible) ───────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: neighborly_minio
    profiles: [infra]
    command: server /data --console-address ":${BASE_COMPOSE_MINIO_CONSOLE_CONTAINER_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-CHANGE_ME}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME}
    volumes:
      - minio_data:/data
    networks:
      - neighborly_network
    restart: unless-stopped
    ports:
      - "${BASE_COMPOSE_MINIO_API_HOST_PORT}:${BASE_COMPOSE_MINIO_API_CONTAINER_PORT}"
      - "${BASE_COMPOSE_MINIO_CONSOLE_HOST_PORT}:${BASE_COMPOSE_MINIO_CONSOLE_CONTAINER_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=PathPrefix(`/minio`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.middlewares.minio-strip.stripprefix.prefixes=/minio"
      - "traefik.http.routers.minio.middlewares=minio-strip"
      - "traefik.http.services.minio.loadbalancer.server.port=${BASE_COMPOSE_MINIO_CONSOLE_CONTAINER_PORT}"
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${BASE_COMPOSE_LOKI_CONTAINER_PORT}/loki/api/v1/push"
        loki-external-labels: "service={{.Name}}"

  # ─── Message Bus ──────────────────────────────────────────────────────────
  nats:
    image: nats:2.10.26-alpine
    container_name: neighborly_bus
    profiles: [infra, app]
    networks:
      - neighborly_network
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${BASE_COMPOSE_LOKI_CONTAINER_PORT}/loki/api/v1/push"
        loki-external-labels: "service={{.Name}}"

  # ─── Redis Cache ──────────────────────────────────────────────────────────
  redis:
    image: redis:7.4.2-alpine
    container_name: neighborly_redis
    profiles: [infra, app]
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - neighborly_network
    restart: unless-stopped
    ports:
      - "${BASE_COMPOSE_REDIS_HOST_PORT}:${BASE_COMPOSE_REDIS_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${BASE_COMPOSE_LOKI_CONTAINER_PORT}/loki/api/v1/push"
        loki-external-labels: "service={{.Name}}"

  # ─── Main Web App (React Admin + Express API) ─────────────────────────────
  web-app:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: neighborly_web_app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-CHANGE_ME}@postgres:${BASE_COMPOSE_POSTGRES_CONTAINER_PORT}/${DB_NAME:-neighborly_db}?schema=public
      MEDIA_DATABASE_URL: postgresql://${MEDIA_DB_USER:-postgres}:${MEDIA_DB_PASSWORD:-CHANGE_ME}@postgres-media:${BASE_COMPOSE_POSTGRES_MEDIA_CONTAINER_PORT}/${MEDIA_DB_NAME:-media_db}
      NATS_URL: nats://nats:${BASE_COMPOSE_NATS_CONTAINER_PORT}
      REDIS_HOST: redis
      REDIS_PORT: ${BASE_COMPOSE_REDIS_CONTAINER_PORT}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      postgres-media:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - neighborly_network
    restart: unless-stopped
    # ports:
    #   LOCAL DEV NOTE: host ports are owned by the split host launcher.
    #   Comment BOTH lines below. UNCOMMENT only when running full Docker stack.
    #   - "${BASE_COMPOSE_DOCUMENTED_API_HOST_PORT}:${BASE_COMPOSE_API_CONTAINER_PORT}"
    #   - "${BASE_COMPOSE_DOCUMENTED_ADMIN_HOST_PORT}:${BASE_COMPOSE_ADMIN_CONTAINER_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-app.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web-app.entrypoints=web"
      - "traefik.http.routers.web-app.priority=1"
      - "traefik.http.services.web-app.loadbalancer.server.port=${BASE_COMPOSE_API_CONTAINER_PORT}"
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${BASE_COMPOSE_LOKI_CONTAINER_PORT}/loki/api/v1/push"
        loki-external-labels: "service={{.Name}}"

  # ─── Container Management ─────────────────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:2.39.2
    container_name: neighborly_portainer
    profiles: [infra]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - neighborly_network
    restart: unless-stopped
    ports:
      - "${BASE_COMPOSE_PORTAINER_HOST_PORT}:${BASE_COMPOSE_PORTAINER_CONTAINER_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=PathPrefix(`/portainer`)"
      - "traefik.http.routers.portainer.entrypoints=web"
      - "traefik.http.middlewares.portainer-strip.stripprefix.prefixes=/portainer"
      - "traefik.http.routers.portainer.middlewares=portainer-strip"
      - "traefik.http.services.portainer.loadbalancer.server.port=${BASE_COMPOSE_PORTAINER_CONTAINER_PORT}"
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${BASE_COMPOSE_LOKI_CONTAINER_PORT}/loki/api/v1/push"
        loki-external-labels: "service={{.Name}}"

  # ─── Container logs ────────────────────────────────────────────────────────
  dozzle:
    image: amir20/dozzle:v8.12.13
    container_name: neighborly_dozzle
    profiles: [infra]
    environment:
      DOZZLE_BASE: /dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - neighborly_network
    restart: unless-stopped
    ports:
      - "${BASE_COMPOSE_DOZZLE_HOST_PORT}:${BASE_COMPOSE_DOZZLE_CONTAINER_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=PathPrefix(`/dozzle`)"
      - "traefik.http.routers.dozzle.entrypoints=web"
      - "traefik.http.routers.dozzle.priority=25"
      - "traefik.http.services.dozzle.loadbalancer.server.port=${BASE_COMPOSE_DOZZLE_CONTAINER_PORT}"
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${BASE_COMPOSE_LOKI_CONTAINER_PORT}/loki/api/v1/push"
        loki-external-labels: "service={{.Name}}"

  # ─── Log Aggregation ──────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.3.2
    container_name: neighborly_loki
    profiles: [infra]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - neighborly_network
    restart: unless-stopped

  # ─── Monitoring Dashboard ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.2
    container_name: neighborly_grafana
    profiles: [infra]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME_BEFORE_DEPLOY}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - neighborly_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=${BASE_COMPOSE_GRAFANA_CONTAINER_PORT}"
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${BASE_COMPOSE_LOKI_CONTAINER_PORT}/loki/api/v1/push"
        loki-external-labels: "service={{.Name}}"

  # ─── Analytics ────────────────────────────────────────────────────────────
  metabase:
    image: metabase/metabase:v0.52.7
    container_name: neighborly_metabase
    profiles: [infra]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_db
      MB_DB_USER: ${DB_USER:-postgres}
      MB_DB_PASS: ${DB_PASSWORD:-CHANGE_ME}
      MB_DB_HOST: postgres
      MB_DB_PORT: ${BASE_COMPOSE_POSTGRES_CONTAINER_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - neighborly_network
    restart: unless-stopped
    ports:
      - "${BASE_COMPOSE_METABASE_HOST_PORT}:${BASE_COMPOSE_METABASE_CONTAINER_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metabase.rule=PathPrefix(`/metabase`)"
      - "traefik.http.routers.metabase.entrypoints=web"
      - "traefik.http.middlewares.metabase-strip.stripprefix.prefixes=/metabase"
      - "traefik.http.routers.metabase.middlewares=metabase-strip"
      - "traefik.http.services.metabase.loadbalancer.server.port=${BASE_COMPOSE_METABASE_CONTAINER_PORT}"
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${BASE_COMPOSE_LOKI_CONTAINER_PORT}/loki/api/v1/push"
        loki-external-labels: "service={{.Name}}"

  # ─── React Frontend (Vite dev server) ─────────────────────────────────────
  frontend:
    profiles: [app]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neighborly_frontend
    environment:
      - VITE_API_URL=http://localhost:${LOCAL_DEVELOPMENT_API_HOST_PORT}/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # ports:
    #   LOCAL DEV NOTE: the split host launcher owns the Vite host port.
    #   Comment the line below. UNCOMMENT only when running full Docker stack.
    #   - "${BASE_COMPOSE_DOCUMENTED_FRONTEND_HOST_PORT}:${BASE_COMPOSE_FRONTEND_CONTAINER_PORT}"
    depends_on:
      - web-app
    networks:
      - neighborly_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/app`) || PathPrefix(`/auth`) || PathPrefix(`/business`) || PathPrefix(`/admin`) || PathPrefix(`/explore`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=10"
      - "traefik.http.services.frontend.loadbalancer.server.port=${BASE_COMPOSE_FRONTEND_CONTAINER_PORT}"
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${BASE_COMPOSE_LOKI_CONTAINER_PORT}/loki/api/v1/push"
        loki-external-labels: "service={{.Name}}"

networks:
  neighborly_network:
    driver: bridge
    name: neighborly_network

volumes:
  postgres_data: {}
  postgres_media_data: {}
  portainer_data: {}
  minio_data: {}
  redis_data: {}
  loki_data: {}
  grafana_data: {}
