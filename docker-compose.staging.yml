name: neighborly_staging

services:
  postgres:
    container_name: neighborly_staging_db
    env_file: !override
      - path: .env.staging
        required: true
    ports: !override ["${STAGING_POSTGRES_HOST_PORT}:${BASE_COMPOSE_POSTGRES_CONTAINER_PORT}"]
  postgres-media:
    container_name: neighborly_staging_media_db
    env_file: !override
      - path: .env.staging
        required: true
    ports: !override ["${STAGING_POSTGRES_MEDIA_HOST_PORT}:${BASE_COMPOSE_POSTGRES_MEDIA_CONTAINER_PORT}"]
  redis:
    container_name: neighborly_staging_redis
    ports: !override ["${STAGING_REDIS_HOST_PORT}:${BASE_COMPOSE_REDIS_CONTAINER_PORT}"]
  nats:
    container_name: neighborly_staging_nats
    ports: !override ["${STAGING_NATS_HOST_PORT}:${BASE_COMPOSE_NATS_CONTAINER_PORT}"]
  minio:
    container_name: neighborly_staging_minio
    ports: !override ["${STAGING_MINIO_API_HOST_PORT}:${BASE_COMPOSE_MINIO_API_CONTAINER_PORT}", "${STAGING_MINIO_CONSOLE_HOST_PORT}:${BASE_COMPOSE_MINIO_CONSOLE_CONTAINER_PORT}"]
  web-app:
    container_name: neighborly_staging_api
    env_file: !override
      - path: .env.staging
        required: true
    environment:
      APP_ENV: staging
      NODE_ENV: production
    ports: !override ["${STAGING_API_HOST_PORT}:${BASE_COMPOSE_API_CONTAINER_PORT}", "${STAGING_ADMIN_HOST_PORT}:${BASE_COMPOSE_ADMIN_CONTAINER_PORT}"]
  frontend:
    container_name: neighborly_staging_frontend
    environment:
      VITE_API_URL: http://localhost:${STAGING_API_HOST_PORT}/api
    ports: !override ["${STAGING_FRONTEND_HOST_PORT}:${BASE_COMPOSE_FRONTEND_CONTAINER_PORT}"]
  traefik:
    container_name: neighborly_staging_traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=neighborly_staging_network"
      - "--entrypoints.web.address=:${BASE_COMPOSE_TRAEFIK_HTTP_CONTAINER_PORT}"
      - "--log.level=INFO"
    ports: !override ["${STAGING_TRAEFIK_HTTP_HOST_PORT}:${BASE_COMPOSE_TRAEFIK_HTTP_CONTAINER_PORT}", "${STAGING_TRAEFIK_DASHBOARD_HOST_PORT}:${BASE_COMPOSE_TRAEFIK_DASHBOARD_CONTAINER_PORT}"]
  loki:
    container_name: neighborly_staging_loki
  grafana:
    container_name: neighborly_staging_grafana
    ports: !override ["${STAGING_GRAFANA_HOST_PORT}:${BASE_COMPOSE_GRAFANA_CONTAINER_PORT}"]
  dozzle:
    container_name: neighborly_staging_dozzle
    ports: !override ["${STAGING_DOZZLE_HOST_PORT}:${BASE_COMPOSE_DOZZLE_CONTAINER_PORT}"]
  metabase:
    container_name: neighborly_staging_metabase
    ports: !override ["${STAGING_METABASE_HOST_PORT}:${BASE_COMPOSE_METABASE_CONTAINER_PORT}"]
  portainer:
    container_name: neighborly_staging_portainer
    ports: !override ["${STAGING_PORTAINER_HOST_PORT}:${BASE_COMPOSE_PORTAINER_CONTAINER_PORT}"]

networks:
  neighborly_network:
    name: neighborly_staging_network

volumes:
  postgres_data: { name: neighborly_staging_postgres }
  postgres_media_data: { name: neighborly_staging_media_postgres }
  portainer_data: { name: neighborly_staging_portainer }
  minio_data: { name: neighborly_staging_minio }
  redis_data: { name: neighborly_staging_redis }
  loki_data: { name: neighborly_staging_loki }
  grafana_data: { name: neighborly_staging_grafana }
