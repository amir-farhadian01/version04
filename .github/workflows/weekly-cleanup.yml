name: "[QualityGuard] Weekly Cleanup"

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (list files without deleting)'
        required: false
        default: 'false'
        type: boolean

jobs:
  cleanup:
    name: Clean temp folder and generate report
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and delete old temp files
        id: cleanup
        run: |
          echo "=== QualityGuard Weekly Cleanup ==="
          echo "Date: $(date -u +%Y-%m-%d)"
          echo ""

          DELETED_FILES=""
          KEPT_FILES=""
          DELETED_COUNT=0

          # Find files in temp/ older than 7 days
          if [ -d "temp" ]; then
            while IFS= read -r -d '' file; do
              if [ "$file" = "temp/.gitkeep" ]; then
                continue
              fi
              AGE=$(( ($(date +%s) - $(date +%s -r "$file")) / 86400 ))
              if [ $AGE -gt 7 ]; then
                DELETED_FILES="$DELETED_FILES\n- \`$file\` (${AGE} days old)"
                if [ "${{ inputs.dry_run }}" != "true" ]; then
                  rm -f "$file"
                  DELETED_COUNT=$((DELETED_COUNT + 1))
                fi
              else
                KEPT_FILES="$KEPT_FILES\n- \`$file\` (${AGE} days old — keeping)"
              fi
            done < <(find temp/ -type f -print0 2>/dev/null)
          fi

          echo "DELETED_COUNT=$DELETED_COUNT" >> $GITHUB_OUTPUT
          echo "DELETED_FILES<<EOF" >> $GITHUB_OUTPUT
          echo -e "$DELETED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "KEPT_FILES<<EOF" >> $GITHUB_OUTPUT
          echo -e "$KEPT_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check uploads folder
        id: uploads_check
        run: |
          UPLOAD_COUNT=0
          if [ -d "uploads" ]; then
            UPLOAD_COUNT=$(find uploads/ -type f | grep -v '.gitkeep' | wc -l)
          fi
          echo "UPLOAD_COUNT=$UPLOAD_COUNT" >> $GITHUB_OUTPUT

      - name: Commit deletions
        if: inputs.dry_run != 'true' && steps.cleanup.outputs.DELETED_COUNT != '0'
        run: |
          git config user.name "QualityGuard Bot"
          git config user.email "qualityguard@version04.bot"
          git add -A
          git diff --staged --quiet || git commit -m "chore(cleanup): QualityGuard weekly temp cleanup — $(date -u +%Y-%m-%d) [skip ci]"
          git push

      - name: Create cleanup report issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const deletedCount = '${{ steps.cleanup.outputs.DELETED_COUNT }}';
            const deletedFiles = `${{ steps.cleanup.outputs.DELETED_FILES }}`;
            const keptFiles = `${{ steps.cleanup.outputs.KEPT_FILES }}`;
            const uploadCount = '${{ steps.uploads_check.outputs.UPLOAD_COUNT }}';
            const isDryRun = '${{ inputs.dry_run }}' === 'true';

            const uploadWarning = parseInt(uploadCount) > 0
              ? `\n\n> ⚠️ **Warning:** Found ${uploadCount} file(s) in \`uploads/\` folder. These should NOT be committed to the repo. Add \`uploads/\` to \`.gitignore\` and remove them.`
              : '';

            const body = `## 🤖 QualityGuard — Weekly Cleanup Report\n\n**Date:** ${date}\n**Mode:** ${isDryRun ? '🔍 Dry Run (no files deleted)' : '🗑️ Live Run'}\n**Files deleted:** ${deletedCount}${uploadWarning}\n\n### Deleted Files\n${deletedFiles || '_No files deleted this week_'}\n\n### Files Kept (< 7 days old)\n${keptFiles || '_No files in temp/_'}\n\n---\n_This issue was auto-generated by QualityGuard. Close it after review._`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[QualityGuard] Weekly Cleanup Report — ${date}`,
              body: body,
              labels: ['automated', 'cleanup']
            });
