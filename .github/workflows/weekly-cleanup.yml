name: Weekly Cleanup
on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday 2AM UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move new temp files to temp/
        run: |
          find . -maxdepth 1 -name "*.tmp" -o \
                 -name "*.log" -o \
                 -name ".start-all-pids" \
                 | xargs -I{} mv {} temp/ 2>/dev/null || true

      - name: Report temp/ contents
        run: |
          echo "=== temp/ contents ==="
          ls -la temp/ || echo "temp/ is empty"
          find temp/ -mtime +7 -type f | wc -l
          echo "files older than 7 days in temp/"

      - name: Delete temp/ files older than 7 days
        run: |
          find temp/ -mtime +7 -type f -delete
          echo "Old temp files deleted"

      - name: Commit cleanup if changes exist
        run: |
          git config user.name "cleanup-agent"
          git config user.email "cleanup@version04"
          git add -A
          git diff --staged --quiet || \
            git commit -m "chore(auto): weekly temp cleanup $(date +%Y-%m-%d)"
          git push origin main || true
