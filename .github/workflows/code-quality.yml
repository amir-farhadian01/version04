name: Code Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint src/ routes/ lib/ --ext .ts --max-warnings 0

  flutter:
    name: Flutter Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - working-directory: flutter_project
        run: flutter pub get
      - name: Flutter analyze
        working-directory: flutter_project
        run: flutter analyze --no-fatal-infos
      - name: Flutter format check
        working-directory: flutter_project
        run: dart format --set-exit-if-changed .
