name: Release to neighborly

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Type RELEASE after staging approval'
        required: true
        type: string

jobs:
  validate:
    name: CI Validation
    if: inputs.confirm_release == 'RELEASE' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neighborly_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - run: npm run release:manifest-check

      - run: npm run plugins:check

      - name: Validate release environment contract
        run: npm run release:env-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MEDIA_DATABASE_URL: ${{ secrets.MEDIA_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MEDIA_DB_PASSWORD: ${{ secrets.MEDIA_DB_PASSWORD }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          KYC_DOCUMENT_SIGNING_SECRET: ${{ secrets.KYC_DOCUMENT_SIGNING_SECRET }}

      - run: npx prisma generate

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/neighborly_test

      - run: npx vitest run --config vitest.backend.config.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/neighborly_test
          JWT_SECRET: ci-release-test-secret
          JWT_REFRESH_SECRET: ci-release-test-refresh-secret
          NODE_ENV: test

      - run: npm run build

      - run: npm run build:admin

      - id: tag
        run: echo "value=v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  release:
    name: Push to neighborly
    runs-on: ubuntu-latest
    needs: validate
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      NEIGHBORLY_TOKEN: ${{ secrets.SYNC_PATNEIGHBORLY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PATNEIGHBORLY }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone neighborly
        run: |
          git clone "https://${NEIGHBORLY_TOKEN}@github.com/amir-farhadian01/neighborly.git" /tmp/neighborly
          git -C /tmp/neighborly config user.name "github-actions[bot]"
          git -C /tmp/neighborly config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync to neighborly
        run: |
          find /tmp/neighborly -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='.env.local' \
            ./ /tmp/neighborly/

          rm -f /tmp/neighborly/firebase-applet-config.json
          rm -f /tmp/neighborly/firebase-blueprint.json
          rm -f /tmp/neighborly/firestore.rules
          rm -f /tmp/neighborly/AGENTS.md
          rm -f /tmp/neighborly/docs/AGENTS.md
          rm -f /tmp/neighborly/docs/CLAUDE.md
          rm -f /tmp/neighborly/untitled.tsx
          find /tmp/neighborly -name '*.save' ! -path '*/.git/*' -delete

          # Remove Merge-only workflows — they must not run in neighborly
          rm -f /tmp/neighborly/.github/workflows/release-to-neighborly.yml
          rm -f /tmp/neighborly/.github/workflows/sync-from-version2.yml
          rm -f /tmp/neighborly/.github/workflows/pr-validation.yml

      - name: Commit and push
        run: |
          cd /tmp/neighborly
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          SHORT_SHA=$(git -C $GITHUB_WORKSPACE rev-parse --short HEAD)
          git commit -m "release: ${TAG} (Merge@${SHORT_SHA})"
          git push origin main

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.SYNC_PATNEIGHBORLY }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          gh release create "${TAG}" \
            --repo amir-farhadian01/neighborly \
            --title "${TAG}" \
            --notes "Source: Merge@${SHORT_SHA} — deploy: git clone + cp .env.example .env + docker compose up -d" \
            --latest

      - name: Summary
        run: |
          echo "Released ${TAG} to neighborly" >> $GITHUB_STEP_SUMMARY
